# Rebuilds the engine comparison site (comparison/) and publishes it to gh-pages on every push to main.
#
# The Word fonts are not in this public repo; they come from the private sverrejb/docxide-pdf-assets repo,
# checked out with a deploy key:
#   assets/fonts/                           -> fonts/                   (engine_compare.py passes it as DOCXSIDE_FONTS)
#   assets/fixtures/{scraped,samples}/      -> tests/fixtures/<group>/  (optional real-world corpus; only tracked
#                                                                         cases are compared when absent)
# Deploy key setup (public half on the assets repo, private half as a secret here):
#   ssh-keygen -t ed25519 -N "" -f assets_key -C docxide-pdf-ci
#   gh repo deploy-key add assets_key.pub -R sverrejb/docxide-pdf-assets -t docxide-pdf-ci
#   gh secret set ASSETS_DEPLOY_KEY -R sverrejb/docxide-pdf < assets_key && rm assets_key assets_key.pub
#
# Caching: Rust deps (rust-cache), competitor binaries (keyed by the version resolved at run time, so a
# new release is built once and then reused), and comparison/ itself (PDFs, screenshots, WebP pages).
# engine_compare.py skips work whose output is newer than its input, so tools/restore_mtime.py gives
# checked-out files their commit times and only changed fixtures are reconverted. (Not the
# git-restore-mtime package: it is built on `git whatchanged`, which the runner's Git refuses, and
# then dates nothing, so every run was cold.) Our binary is rebuilt
# every run and always reconverted; a competitor version or font change is in the cache key and starts cold.
name: Engine comparison
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # force-push gh-pages
concurrency:
  group: engine-comparison   # deploy is a force-push; a queued run starts warm from the cache the running one saves
jobs:
  compare:
    # 26.04's archive has mupdf 1.27 and LibreOffice 26.2; 24.04's mupdf 1.23 lacks the stext `text=`
    # attribute the text-boundary metric parses.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      VERAPDF: "1.30.2"
      PYTHONUNBUFFERED: "1"   # engine_compare.py's per-case lines get real timestamps in the log
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # restore-mtime needs history
      - uses: actions/checkout@v7
        with:
          repository: sverrejb/docxide-pdf-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets
          fetch-depth: 0
      - name: Install LibreOffice, mutool, cwebp, pdfinfo, Java
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mupdf-tools webp libreoffice-writer \
            poppler-utils default-jre-headless
      - name: Install veraPDF   # not in Ubuntu's archive; the official installer of the release Homebrew ships
        run: |
          curl -sSfL "https://software.verapdf.org/rel/${VERAPDF%.*}/verapdf-greenfield-${VERAPDF}-installer.zip" -o "$RUNNER_TEMP/verapdf.zip"
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP"
          java -DINSTALL_PATH="$HOME/verapdf" -jar "$RUNNER_TEMP/verapdf-greenfield-${VERAPDF}/verapdf-izpack-installer-${VERAPDF}.jar" -options-system
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
      - name: Link private assets
        run: |
          ln -s "$PWD/assets/fonts" fonts
          for g in scraped samples; do [ ! -d "assets/fixtures/$g" ] || ln -s "$PWD/assets/fixtures/$g" "tests/fixtures/$g"; done
          mkdir -p ~/.local/share && ln -s "$PWD/assets/fonts" ~/.local/share/fonts && fc-cache -f   # LibreOffice sees them via fontconfig
          python3 tools/restore_mtime.py . && python3 tools/restore_mtime.py assets
      - name: Word fonts where jubarte looks for them
        # jubarte reads no Linux font directory and no fontconfig. It resolves its catalogue faces (Calibri,
        # Arial, Times New Roman, Cambria, Aptos, Verdana, Georgia, Symbol, …) from Word-for-Mac's folders
        # by fixed file names, and cloud families from Word's per-family cache folders; anything else comes
        # from JUBARTE_FONT_DIR, which engine_compare.py sets. Without the two links below it would draw
        # every Calibri/Arial/Times document in its bundled Carlito/Liberation while the other engines get
        # the real fonts. Our vendored files carry the names it expects (Calibri.ttf, times.ttf, Cambria.ttc…).
        run: |
          sudo mkdir -p /Library/Fonts && sudo ln -s "$PWD/assets/fonts" /Library/Fonts/Microsoft
          mkdir -p ~/"Library/Group Containers/UBF8T346G9.Office/FontCache/4"
          ln -s "$PWD/assets/fonts/CloudFonts" ~/"Library/Group Containers/UBF8T346G9.Office/FontCache/4/CloudFonts"
      - name: Font families the runner's own packages share with the Word fonts
        # Our discovery ranks /usr/share/fonts above DOCXSIDE_FONTS (fonts/) and ~/.local/share/fonts is the
        # same files as fonts/, so the only way a system font can shadow a Word font here is a distro package
        # shipping the same family name. Anything listed below is drawn from the distro's file, not Word's.
        run: |
          fc-list --format '%{file}|%{family[0]}\n' | awk -F'|' '
            /^\/usr\/share\/fonts/ {sys[tolower($2)]=$1}
            /\.local\/share\/fonts/ {ours[tolower($2)]=1}
            END {n=0; for (f in ours) if (f in sys) {print "  SHADOWED: " f " <- " sys[f]; n++}; print n " shared family names"}'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools -> target
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: minipdf-cli   # installs `minipdf`
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: rdocx-cli     # installs `rdocx`
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: office2pdf-cli   # installs `office2pdf`
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: jubarte-redlines   # installs `jubarte`; engine_compare.py hands it the fonts via JUBARTE_FONT_DIR
      - name: Competitor versions for the cache key
        id: ver
        # "fontdir2": competitors now get the fonts through comparison/work/fonts_flat (rdocx had none before);
        # cached PDFs from earlier keys were rendered without them and must not be reused.
        run: echo "key=lo$(soffice --version | awk '{print $2}')-minipdf$(minipdf --version | awk '{print $NF}')-rdocx$(rdocx --version | awk '{print $NF}')-o2p$(office2pdf --version | awk '{print $NF}')-jub$(jubarte --version | awk '{print $NF}')-verapdf${VERAPDF}-fonts${{ hashFiles('assets/fonts/**') }}-fontdir2" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: comparison
          key: comparison-${{ steps.ver.outputs.key }}-${{ github.run_id }}
          restore-keys: comparison-${{ steps.ver.outputs.key }}-
      - run: python3 tools/engine_compare.py
      - uses: actions/cache/save@v6
        if: always()   # keep the progress of a failed run
        with:
          path: comparison
          key: comparison-${{ steps.ver.outputs.key }}-${{ github.run_id }}
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/deploy_comparison.sh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
